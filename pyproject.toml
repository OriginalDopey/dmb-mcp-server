[project]
name = "dmb-mcp-server"
version = "0.1.0"
description = "MCP server for Diamond Mind Baseball league intelligence on ImagineSports"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "originaldopey" }]
dependencies = [
    "mcp[cli]>=1.6.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
    "pre-commit>=3.8",
    "types-requests",
    "types-beautifulsoup4",
    "cyclonedx-bom>=5.0",
    "pip-licenses>=4.0",
]

[project.scripts]
dmb-mcp = "dmb_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dmb_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/dmb_mcp", "config", "migrations", "skills", "docs"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
exclude = [
    "src/dmb_mcp/db/_database_body.py",
    "src/dmb_mcp/scraper/_session_body.py",
    "src/dmb_mcp/scraper/parsers/_parsers_body.py",
    "src/dmb_mcp/scraper/_league_scraper_body.py",
]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["dmb_mcp"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["dmb_mcp"]
omit = ["*/tests/*"]
