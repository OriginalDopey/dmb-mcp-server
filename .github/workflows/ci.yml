name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DMB_CONFIG_PATH: config/leagues.example.json
  DMB_DB_PATH: data/test_is_scout.db
  DMB_SESSION_PATH: .is_session

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m ruff format --check src tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest --cov=dmb_mcp --cov-report=term-missing
      - run: python -m pip install cyclonedx-bom
      - run: cyclonedx-py environment -o sbom.json --output-format json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
